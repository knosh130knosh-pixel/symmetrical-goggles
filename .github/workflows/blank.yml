name: RDP

# rdp by JoyWardanaa modifed

on:

workflow_dispatch:

jobs:

secure-rdp:

runs-on: windows-latest

timeout-minutes: 3600

steps:

- name: Configure Core RDP Settings By JoyWardanaa

run: |

Set-ItemProperty -Path 'HKLM: \System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force Set-ItemProperty -Path 'HKLM: \System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force

Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\ControAT terminal Server\WinStations\RDP-cp -Name "SecurityLayer" -Value 0 -Force

netsh advfirewall firewall delete rule name="RDP-Tailscale"

netsh advfirewall firewall add...

Read complete
